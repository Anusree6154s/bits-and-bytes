
name: Sync DEV.to Series

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Apply series updates?"
        required: true
        type: boolean
        default: false

  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: read

jobs:
  sync-series:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Synchronize DEV series
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          APPLY_CHANGES: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply_changes) || (github.event_name == 'schedule' && vars.APPLY_SERIES_ON_SCHEDULE == 'true') }}
        run: python scripts/sync_devto_series.py
