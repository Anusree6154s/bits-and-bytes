<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Decap CMS Script -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      window.addEventListener("message", (event) => {
        // Ensure message is string data from OAuth popup
        if (typeof event.data === "string" && event.data.startsWith("authorization:github:success:")) {
          try {
            const jsonStr = event.data.replace("authorization:github:success:", "");
            const authData = JSON.parse(jsonStr);

            // Construct exact user object Decap requires
            const cmsUser = {
              token: authData.token,
              provider: "github",
              backendName: "github"
            };

            // Save to localStorage
            localStorage.setItem("decap-cms-user", JSON.stringify(cmsUser));

            // Reload to activate CMS dashboard
            window.location.reload();
          } catch (err) {
            console.error("Failed to parse OAuth message:", err);
          }
        }
      });
    </script>
  </body>
</html>
