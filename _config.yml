show_excerpts: true
theme: just-the-docs

permalink: /:title/

collections:
  docs:
    permalink: /:path/
    output: true
    sort_by: order

just_the_docs:
  collections:
    - docs
  nav_sort: case_insensitive
  search:
    enabled: true
    heading_level: 2
    preview_words: 10
    button_text: Search

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - node_modules
  - vendor
  - .dist
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - _site
  - content

include:
  - _pages
  - _layouts
  - _docs

disqus:
  shortname: anusree-anilkumar-blog

sass:
  style: compressed
